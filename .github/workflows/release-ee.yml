name: Release EE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release-ee:
    runs-on: ubuntu-latest
    environment:
      name: cibseven-ee
      deployment: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine EE image tags
        id: image-tags
        shell: bash
        run: |
          {
            echo 'tags<<EOF'
            if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
              echo "ghcr.io/digibp/digibp-classroom-ee:${GITHUB_REF_NAME}"
              echo 'ghcr.io/digibp/digibp-classroom-ee:latest'
            else
              echo "ghcr.io/digibp/digibp-classroom-ee:test-${GITHUB_SHA}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: mvn-cibseven-enterprise
          server-username: CIB_MAVEN_USERNAME
          server-password: CIB_MAVEN_PASSWORD

      - name: Build and test EE
        env:
          CIB_MAVEN_USERNAME: ${{ secrets.CIB_MAVEN_USERNAME }}
          CIB_MAVEN_PASSWORD: ${{ secrets.CIB_MAVEN_PASSWORD }}
        run: mvn -B -Pcibseven-ee clean verify

      - name: Prepare Docker context with the verified EE JAR
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ee-image/target"
          cp Dockerfile .dockerignore "$RUNNER_TEMP/ee-image/"
          cp target/digibp-classroom.jar "$RUNNER_TEMP/ee-image/target/"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false

      - name: Build and push EE Docker image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ${{ runner.temp }}/ee-image
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
