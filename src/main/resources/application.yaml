camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
    filter:
      create: All Tasks
    authorization:
      enabled: true
    generic-properties:
      properties:
        historyTimeToLive: "P180D"
        useCibSevenNamespaceInScripting: true
        useCibSevenNamespaceInReflection: true
    webapp:
      header-security:
        content-security-policy-value: font-src 'self' data:;
  bpmn:
    authorization:
      enabled: true
#    webapp:
#      application-path: /
spring:
  profiles:
    active: local

## Server configuration for reverse proxy (HTTPS)
server:
  forward-headers-strategy: native
  compression:
    enabled: true

springdoc:
  swagger-ui:
    enabled: true
    path: /apis
    disable-swagger-default-url: true
    urls-primary-name: DigiBP Message API
    urls:
      - name: CIB seven REST API
        url: /cibseven-rest/openapi.json

cibseven:
  webclient:
    authentication:
      jwtSecret: ${CIBSEVEN_WEBCLIENT_AUTHENTICATION_JWTSECRET:}
    engine-rest:
      url: ${CIBSEVEN_ENGINE_REST_URL:http://localhost:8080}
      path: /engine-rest
      display-name: DigiBP Classroom
      tooltip: Embedded CIB seven engine
    engineRest:
      url: ${CIBSEVEN_ENGINE_REST_URL:http://localhost:8080}
      path: /engine-rest
    modeler:
      enabled: true
      templates:
        paths:
          - classpath*:element-templates/*.json
